<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>THE CORRIDOIO - Quiz</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
        background-color: #0fffff;
        background-image: radial-gradient(#ff007f 1px, transparent 0);
        background-size: 24px 24px;
        color: #000;
        padding: 15px;
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 180px;
        background: #000;
        padding: 20px 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 4px solid #fff;
        box-shadow: 6px 6px 0px #000;
        align-self: flex-start;
    }

    .sidebar-title {
        color: #fffb00;
        font-size: 1.1rem;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 10px;
        border-bottom: 2px dashed #fff;
        padding-bottom: 5px;
    }

    .nav-btn {
        background: #fff;
        color: #000;
        border: 3px solid #000;
        padding: 8px;
        text-align: center;
        text-decoration: none;
        font-size: 0.9rem;
        text-transform: uppercase;
        font-weight: bold;
    }

    .nav-btn:hover,
    .nav-btn.active {
        background: #ff007f;
        color: #fff;
    }

    .page-container {
        flex: 1;
        max-width: 980px;
        margin: 0 auto 0 20px;
        background: #fff;
        border: 6px solid #000;
        box-shadow: 12px 12px 0px #000;
        padding: 30px;
    }

    .page-badge {
        display: inline-block;
        padding: 4px 12px;
        font-size: 0.9rem;
        color: #fff;
        background: #9c27b0;
        border: 3px solid #000;
        text-transform: uppercase;
        margin-bottom: 15px;
    }

    h1 {
        font-size: 3rem;
        text-transform: uppercase;
        line-height: 1.1;
        margin-bottom: 20px;
        border-bottom: 5px solid #000;
        padding-bottom: 10px;
    }

    .quiz-container {
        background: #ffffff;
        border: 4px solid #000;
        box-shadow: 8px 8px 0px #000;
        padding: 24px;
        border-radius: 0;
    }

    .question-number {
        font-size: 1rem;
        font-weight: bold;
        color: #ff007f;
        margin-bottom: 10px;
    }

    .question {
        font-family: 'Arial', sans-serif;
        font-size: 1.5rem;
        font-weight: bold;
        color: #222;
        margin-bottom: 20px;
        line-height: 1.4;
    }

    .answers {
        display: grid;
        gap: 12px;
        margin-bottom: 20px;
    }

    button.answer-btn {
        width: 100%;
        padding: 16px;
        border: 4px solid #000;
        background: #0fffff;
        color: #000;
        font-family: 'Arial', sans-serif;
        font-size: 1rem;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    button.answer-btn:hover {
        transform: translateY(-2px);
        background: #fffb00;
    }

    .correct {
        background: #4caf50 !important;
        color: #fff !important;
    }

    .wrong {
        background: #e63946 !important;
        color: #fff !important;
    }

    .next-btn,
    .restart-btn {
        width: 100%;
        padding: 16px;
        border: 4px solid #000;
        background: #ff007f;
        color: #fff;
        font-family: 'Arial', sans-serif;
        font-size: 1rem;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .next-btn:hover,
    .restart-btn:hover {
        transform: translateY(-2px);
        background: #000;
    }

    .next-btn {
        display: none;
        margin-top: 8px;
    }

    .result {
        text-align: center;
    }

    .result h2 {
        font-size: 2.5rem;
        margin-bottom: 20px;
    }

    .score {
        font-size: 1.6rem;
        margin-bottom: 18px;
        color: #ff007f;
        font-weight: bold;
    }

    .message {
        font-size: 1.1rem;
        margin-bottom: 22px;
        color: #222;
    }

    body,
    p,
    button,
    .question,
    .question-number,
    .score,
    .message {
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
</style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-title">Sfoglia 📖</div>
        <a href="giornalino.html" class="nav-btn">Prima Pagina</a>
        <a href="pag2.html" class="nav-btn">Pag 2</a>
        <a href="pag3.html" class="nav-btn">Pag 3</a>
        <a href="pag4.html" class="nav-btn">Pag 4</a>
        <a href="pag5.html" class="nav-btn">Pag 5</a>
        <a href="pag6.html" class="nav-btn">Pag 6</a>
        <a href="pag7.html" class="nav-btn">Pag 7</a>
        <a href="pag8.html" class="nav-btn">Pag 8</a>
        <a href="quiz.html" class="nav-btn active">Quiz</a>
    </nav>

    <main class="page-container">
        <span class="page-badge">Quiz / Gioco</span>
        <h1>IL QUIZ DEL CORRIDOIO</h1>

        <div class="quiz-container">
            <div id="quiz">
                <div class="question-number" id="question-number"></div>
                <div class="question" id="question"></div>
                <div class="answers" id="answers"></div>
                <button class="next-btn" id="next-btn">Prossima domanda</button>
            </div>
        </div>
    </main>

<script>
const allQuestions = [
    {
        question: "Qual è la capitale della Francia?",
        answers: ["Madrid", "Parigi", "Berlino", "Roma"],
        correct: 1
    },
    {
        question: "Chi ha scoperto l'America nel 1492?",
        answers: ["Galileo Galilei", "Cristoforo Colombo", "Napoleone", "Leonardo da Vinci"],
        correct: 1
    },
    {
        question: "Quanto fa 7 × 8?",
        answers: ["54", "56", "64", "58"],
        correct: 1
    },
    {
        question: "Chi ha scritto 'I Promessi Sposi'?",
        answers: ["Dante", "Leopardi", "Manzoni", "Pirandello"],
        correct: 2
    },
    {
        question: "In che anno è iniziata la Seconda Guerra Mondiale?",
        answers: ["1939", "1945", "1914", "1922"],
        correct: 0
    },
    {
        question: "Qual è il risultato di 12²?",
        answers: ["124", "122", "144", "132"],
        correct: 2
    },
    {
        question: "Quale pianeta è conosciuto come Pianeta Rosso?",
        answers: ["Venere", "Giove", "Marte", "Saturno"],
        correct: 2
    },
    {
        question: "Chi ha dipinto la Gioconda?",
        answers: ["Van Gogh", "Michelangelo", "Leonardo da Vinci", "Raffaello"],
        correct: 2
    },
    {
        question: "Qual è il sinonimo di 'felice'?",
        answers: ["Triste", "Contento", "Arrabbiato", "Vuoto"],
        correct: 1
    },
    {
        question: "Quanto fa 100 ÷ 4?",
        answers: ["20", "30", "25", "15"],
        correct: 2
    },
    {
        question: "Chi era il re d'Italia durante la Prima Guerra Mondiale?",
        answers: ["Vittorio Emanuele III", "Umberto I", "Garibaldi", "Cavour"],
        correct: 0
    },
    {
        question: "Quale tra questi è un verbo?",
        answers: ["Casa", "Correre", "Rosso", "Libro"],
        correct: 1
    },
    {
        question: "Quanto fa 15 + 27?",
        answers: ["42", "41", "45", "40"],
        correct: 0
    },
    {
        question: "Qual è il fiume più lungo d'Italia?",
        answers: ["Tevere", "Arno", "Po", "Adige"],
        correct: 2
    },
    {
        question: "Chi ha scritto la Divina Commedia?",
        answers: ["Boccaccio", "Petrarca", "Dante Alighieri", "Ungaretti"],
        correct: 2
    },
    {
        question: "Quanto fa 9 × 9?",
        answers: ["72", "81", "99", "79"],
        correct: 1
    },
    {
        question: "Qual è la lingua ufficiale del Brasile?",
        answers: ["Spagnolo", "Portoghese", "Francese", "Inglese"],
        correct: 1
    },
    {
        question: "In che secolo visse Giulio Cesare?",
        answers: ["I secolo a.C.", "V secolo", "X secolo", "XV secolo"],
        correct: 0
    },
    {
        question: "Qual è il contrario di 'alto'?",
        answers: ["Grande", "Piccolo", "Basso", "Lungo"],
        correct: 2
    },
    {
        question: "Quanto fa 50 - 18?",
        answers: ["32", "28", "30", "35"],
        correct: 0
    }
];

function getRandomQuestions(arr, num) {
    const shuffled = [...arr].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, num);
}

const questions = getRandomQuestions(allQuestions, 3);
const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const nextBtn = document.getElementById("next-btn");
const questionNumber = document.getElementById("question-number");
const quizContainer = document.getElementById("quiz");

let currentQuestion = 0;
let score = 0;

function showQuestion() {
    resetState();
    const q = questions[currentQuestion];
    questionNumber.innerText = `Domanda ${currentQuestion + 1} di ${questions.length}`;
    questionElement.innerText = q.question;
    q.answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;
        btn.classList.add("answer-btn");
        btn.addEventListener("click", () => selectAnswer(index, btn));
        answersElement.appendChild(btn);
    });
}

function resetState() {
    nextBtn.style.display = "none";
    answersElement.innerHTML = "";
}

function selectAnswer(index, button) {
    const correct = questions[currentQuestion].correct;
    const buttons = document.querySelectorAll(".answer-btn");
    buttons.forEach(btn => btn.disabled = true);
    if (index === correct) {
        button.classList.add("correct");
        score++;
    } else {
        button.classList.add("wrong");
        buttons[correct].classList.add("correct");
    }
    nextBtn.style.display = "block";
}

nextBtn.addEventListener("click", () => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
});

function showResult() {
    let message = "";
    if (score === 3) {
        message = "🏆 Perfetto! Sei un genio della cultura generale!";
    } else if (score === 2) {
        message = "👏 Ottimo lavoro! Hai fatto davvero bene!";
    } else if (score === 1) {
        message = "🙂 Non male! Un po' di allenamento e spacchi tutto!";
    } else {
        message = "😅 Ritenta! La prossima volta andrà meglio!";
    }
    quizContainer.innerHTML = `
        <div class="result">
            <h2>Quiz completato!</h2>
            <div class="score">Hai ottenuto ${score} / ${questions.length}</div>
            <div class="message">${message}</div>
            <button class="restart-btn" onclick="location.reload()">
                🔄 Gioca ancora
            </button>
        </div>
    `;
}

showQuestion();
</script>
</body>
</html>
